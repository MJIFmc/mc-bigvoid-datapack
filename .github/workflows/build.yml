name: Build datapack

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build datapacks
        run: bash build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threebody-bigvoid
          path: |
            dist/threebody-bigvoid.zip
            dist/threebody-bigvoid-name-resourcepack.zip
